name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,azure,functions]"
      - name: Lint and types
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m bandit -c pyproject.toml -r src -q
      - name: Local-only tests and coverage
        run: python -m pytest -m "not integration" --cov --cov-report=term-missing
      - name: Scan publication files
        run: git ls-files -z | xargs -0 python tools/secret_scan.py
      - name: Verify package layout
        run: python tools/build_function_package.py --require-lock

  history-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with redacted output
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

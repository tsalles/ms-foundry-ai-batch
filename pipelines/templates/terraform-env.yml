# Workload identity federation for azurerm/azapi from Azure DevOps (no client secrets).
# Tokens are refreshed through the service connection during long applies.
parameters:
  - name: serviceConnectionId
    type: string
  - name: clientId
    type: string
  - name: tenantId
    type: string
  - name: subscriptionId
    type: string

steps:
  - bash: |
      echo "##vso[task.setvariable variable=ARM_USE_OIDC]true"
      echo "##vso[task.setvariable variable=ARM_CLIENT_ID]${{ parameters.clientId }}"
      echo "##vso[task.setvariable variable=ARM_TENANT_ID]${{ parameters.tenantId }}"
      echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]${{ parameters.subscriptionId }}"
      echo "##vso[task.setvariable variable=ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID]${{ parameters.serviceConnectionId }}"
      echo "##vso[task.setvariable variable=ARM_OIDC_AZURE_SERVICE_CONNECTION_ID]${{ parameters.serviceConnectionId }}"
    displayName: Configure OIDC for Terraform

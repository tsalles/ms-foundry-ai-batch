# Applies exactly the reviewed saved plan (TC-H01). Runs inside a deployment job bound to an
# Azure DevOps environment whose approval check is the G2 gate.
parameters:
  - name: root
    type: string
  - name: backendKey
    type: string
  - name: artifactName
    type: string
  - name: resourceGroup
    type: string
    default: rg-foundry-batch-poc
  - name: stateContainer
    type: string
    default: tfstate   # workload state; bootstrap state is in tfstate-bootstrap

steps:
  - download: current
    artifact: ${{ parameters.artifactName }}

  - bash: |
      set -euo pipefail
      cat > "$(Agent.TempDirectory)/backend.hcl" <<HCL
      resource_group_name  = "${{ parameters.resourceGroup }}"
      storage_account_name = "$(TF_STATE_STORAGE_ACCOUNT)"
      container_name       = "${{ parameters.stateContainer }}"
      key                  = "${{ parameters.backendKey }}"
      use_azuread_auth     = true
      use_oidc             = true
      HCL
      terraform -chdir=${{ parameters.root }} init -input=false -lockfile=readonly -backend-config="$(Agent.TempDirectory)/backend.hcl"
      terraform -chdir=${{ parameters.root }} apply -input=false -lock-timeout=10m "$(Pipeline.Workspace)/${{ parameters.artifactName }}/tfplan"
      # Non-sensitive outputs only (registration and smoke settings).
      terraform -chdir=${{ parameters.root }} output -json > "$(Build.ArtifactStagingDirectory)/tf-outputs.json"
      python tools/secret_scan.py --strict "$(Build.ArtifactStagingDirectory)/tf-outputs.json"
    displayName: terraform apply (saved plan)
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)

  - publish: $(Build.ArtifactStagingDirectory)/tf-outputs.json
    artifact: tf-outputs
    displayName: publish non-secret outputs
